<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homeguard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #677085;
    --line: #e2e5eb; --ok: #1f8a4c; --warn: #b26b00; --bad: #c62828;
    --accent: #2f5fd0; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #98a1b3;
      --line: #2a313d; --ok: #4cc27f; --warn: #e0a03a; --bad: #ff6b6b;
      --accent: #7aa2ff; --chip: #252c38;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .state { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
  .badge { font-weight: 700; font-size: 22px; padding: 6px 14px; border-radius: 8px; color: #fff; background: var(--muted); }
  .badge.disarmed { background: var(--ok); }
  .badge.arming, .badge.pending { background: var(--warn); }
  .badge.armed { background: var(--accent); }
  .badge.triggered { background: var(--bad); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .6; } }
  .cause { color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--chip); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=password] {
    font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); width: 9em;
  }
  #message { min-height: 1.4em; margin-top: 8px; color: var(--muted); }
  #message.error { color: var(--bad); }
  .zones { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .zone h3 { margin: 0 0 8px; font-size: 15px; }
  .device { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
  .device:first-of-type { border-top: 0; }
  .device .kind { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .dot.off { background: var(--bad); }
  .open { color: var(--warn); font-weight: 600; }
  .people { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 999px; padding: 4px 12px; }
  .chip.home { outline: 2px solid var(--ok); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.time { white-space: nowrap; color: var(--muted); width: 1%; }
  td.kind { white-space: nowrap; width: 1%; font-size: 12px; color: var(--muted); }
  .lvl-critical { color: var(--bad); font-weight: 700; }
  .lvl-high { color: var(--warn); font-weight: 600; }
  img.snap { display: block; max-width: 220px; width: 100%; border-radius: 6px; margin-top: 6px; cursor: zoom-in; }
  .muted { color: var(--muted); }
  footer { margin: 24px 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>homeguard</h1>
    <span id="updated" class="muted">connecting…</span>
  </header>

  <section class="card state" aria-live="polite">
    <span id="badge" class="badge">…</span>
    <span id="cause" class="cause"></span>
  </section>

  <section class="card" style="margin-top:12px">
    <div class="controls">
      <button class="primary" data-arm="away">Arm away</button>
      <button data-arm="home">Arm home</button>
      <button data-arm="night">Arm night</button>
    </div>
    <form class="controls" id="disarm-form" autocomplete="off">
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="Disarm PIN">
      <button type="submit">Disarm</button>
    </form>
    <div id="message"></div>
  </section>

  <h2>Zones</h2>
  <section id="zones" class="zones"></section>

  <h2>People</h2>
  <section id="people" class="people muted">No one configured.</section>

  <h2>Recent events</h2>
  <section class="card"><table><tbody id="events"></tbody></table></section>

  <footer>Refreshes every 3 seconds. Snapshots come from Frigate through homeguard.</footer>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

function say(text, isError) {
  const m = $("message");
  m.textContent = text;
  m.className = isError ? "error" : "";
}

// Absolute URLs from the origin: if the page was opened as
// http://user:pass@hub/, relative fetches would carry the credentials and fail.
async function api(path, options) {
  const response = await fetch(location.origin + path, { credentials: "same-origin", ...options });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

const KIND = { contact: "door/window", pir: "motion (PIR)", wisense: "WiFi motion", smoke: "smoke", leak: "leak", camera: "camera" };

function renderStatus(s) {
  const badge = $("badge");
  badge.className = "badge " + s.state;
  badge.textContent = s.state + (s.mode ? " · " + s.mode : "");
  $("cause").textContent = s.cause || "";

  const zones = $("zones");
  zones.replaceChildren();
  for (const zone of s.zones) {
    const card = el("div", { class: "card zone" }, el("h3", {}, zone.id));
    if (zone.devices.length === 0) card.append(el("div", { class: "muted" }, "No devices."));
    for (const d of zone.devices) {
      const state = el("span", {});
      if (d.open === true) state.append(el("span", { class: "open" }, "open"));
      else if (d.open === false) state.append(el("span", { class: "muted" }, "closed"));
      state.append(" ", el("span", { class: d.online ? "dot" : "dot off", title: d.online ? "online" : "offline" }),
        d.online ? "" : "offline");
      card.append(el("div", { class: "device" },
        el("span", {}, d.name, el("br"), el("span", { class: "kind" }, KIND[d.kind] || d.kind)),
        state));
    }
    zones.append(card);
  }

  const people = $("people");
  if (s.presence.length) {
    people.className = "people";
    people.replaceChildren(...s.presence.map((p) =>
      el("span", { class: p.home ? "chip home" : "chip" },
        p.name + " · " + (p.home === true ? "home" : p.home === false ? "away" : "unknown"))));
  }
}

function renderEvents(rows) {
  const body = $("events");
  body.replaceChildren();
  if (!rows.length) {
    body.append(el("tr", {}, el("td", { class: "muted" }, "No events yet.")));
    return;
  }
  for (const r of rows) {
    const text = el("td", { class: r.level ? "lvl-" + r.level : "" }, r.text);
    if (r.snapshot_ref) {
      const src = location.origin + "/api/snapshot/" + encodeURIComponent(r.snapshot_ref);
      const img = el("img", { class: "snap", src, alt: "snapshot", loading: "lazy" });
      img.addEventListener("click", () => window.open(src, "_blank", "noopener"));
      img.addEventListener("error", () => img.remove());
      text.append(img);
    }
    const when = new Date(r.unix_ms);
    body.append(el("tr", {},
      el("td", { class: "time", title: when.toLocaleString() }, when.toLocaleTimeString()),
      el("td", { class: "kind" }, r.level ? r.kind + " · " + r.level : r.kind),
      text));
  }
}

async function refresh() {
  try {
    const [status, events] = await Promise.all([api("/api/status"), api("/api/events?limit=40")]);
    renderStatus(status);
    renderEvents(events);
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("updated").textContent = "offline: " + e.message;
  }
}

async function post(path, payload) {
  return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
}

for (const button of document.querySelectorAll("[data-arm]")) {
  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      renderStatus(await post("/api/arm", { mode: button.dataset.arm }));
      say("Arming " + button.dataset.arm + ".");
    } catch (e) { say(e.message, true); }
    button.disabled = false;
  });
}

$("disarm-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const pin = $("pin");
  try {
    renderStatus(await post("/api/disarm", { pin: pin.value }));
    say("Disarmed.");
  } catch (e) { say(e.message, true); }
  pin.value = "";
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
