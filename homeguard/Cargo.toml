[package]
name = "homeguard"
version = "0.1.0"
edition = "2021"
description = "Local, self-hosted home security hub: alarm state machine, sensor fusion and alerts over MQTT"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Abdelilah-99/wisense"
readme = "README.md"
publish = false
default-run = "homeguard"

# Standalone: not a member of the wisense crate at the repository root.
[workspace]

[[bin]]
name = "homeguard"
path = "src/main.rs"

[[bin]]
name = "homeguard-wisense-bridge"
path = "src/bin/homeguard-wisense-bridge.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
# Decoding HTTP Basic credentials for the dashboard.
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
# Telegram Bot API (HTTPS, rustls) and Frigate snapshots.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
# The Discord bot's gateway connection (a WebSocket over TLS, outbound).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Plain TCP to the broker on loopback: no TLS stack needed.
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs", "io-util", "io-std", "net", "process"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std", "env-filter"] }

[dev-dependencies]
# A paused clock, so retry and backoff tests run instantly.
tokio = { version = "1", features = ["test-util"] }
# The fake Discord gateway in tests/discord.rs (server side).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
# Drives the axum router in API tests without a socket.
tower = { version = "0.5", features = ["util"] }
