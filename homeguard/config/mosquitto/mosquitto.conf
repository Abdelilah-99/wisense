# Mosquitto for homeguard. Inside the container the broker listens on all
# interfaces, but Compose publishes it on the hub's loopback only (and on the
# LAN only with the `mqtt-lan` profile).
listener 1883
protocol mqtt

# Every client must log in. Accounts live in passwd, generated from .env by
# scripts/mqtt-passwd.sh (never committed).
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
