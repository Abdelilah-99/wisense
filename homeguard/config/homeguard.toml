# homeguard configuration. Secrets never go here: they come from .env.
# Durations are written like "30s", "2m", "1h30m", "7d".

# The zones of the home. Every sensor and camera belongs to one; motion is
# only confirmed by other sources in the same zone.
zones = ["entrance", "living-room", "kitchen", "garden"]

[alarm]
# Time to leave after arming.
exit_delay = "60s"
# Time to disarm after an entry door opens.
entry_delay = "30s"
# A triggered alarm stops the siren and re-arms after this long.
auto_reset = "10m"

# Rules that cut false alarms (see README, "Sensor fusion").
[fusion]
# Motion alone waits this long for confirmation (a person on a camera in the
# same zone, or motion from another kind of sensor in the same zone).
confirm_window = "20s"
# Minimum Frigate score for a person to count (0 to 1).
person_score = 0.7
# At most one "unconfirmed motion" notice per zone this often.
unconfirmed_cooldown = "10m"
# The same alert (same cause) at most once this often.
alert_cooldown = "5m"
# A door opening this soon after a known phone came home is the owner.
owner_arrival_window = "2m"
# Then intrusion sensors are ignored this long, unless auto_disarm is on.
owner_grace = "5m"
# Ignore devices that come back online within this time.
offline_debounce = "60s"

# Who is home, from the phones on the LAN (see README, "Phone presence").
# Each phone must use its real MAC on the home WiFi: turn off MAC
# randomization ("private address") for this network on the phone.
[presence]
# A phone unseen this long is away (phones sleep and stop answering).
grace = "10m"
probe_interval = "30s"
# Optional: sweep this subnet to find phones whose IP changed (/22 to /30).
# subnet = "192.168.1.0/24"
# Arm (away) once everyone has been away past the grace period. Off by default.
auto_arm = false
# Disarm an away arming when a known person comes home. Off by default.
auto_disarm = false

# One entry per person. The MAC is read from the named variable in .env,
# never written here. `ip` (optional) is the phone's DHCP reservation.
# [[presence.people]]
# name = "alice"
# mac_env = "HOMEGUARD_PHONE_ALICE"
# ip = "192.168.1.50"

# Every sensor and camera homeguard should know about. `modes` lists the arm
# modes in which it can raise an alarm. Defaults: contacts in every mode,
# motion sensors (pir, wisense) in away only, cameras in away and night.
# Smoke and leak sensors always alert, whatever the mode. `critical = true`
# makes it going offline while armed a tampering alert; the default is true
# for contacts, wisense and smoke sensors, false for PIR and leak sensors
# (they more often just have a flat battery). Cameras are always critical.

[[sensors]]
id = "front_door"
kind = "contact"
zone = "entrance"
name = "Front door"

[[sensors]]
id = "living_room_pir"
kind = "pir"
zone = "living-room"
name = "Living room motion"

[[sensors]]
id = "living_room_wisense"
kind = "wisense"
zone = "living-room"
name = "Living room WiFi motion (wisense)"

[[sensors]]
id = "hallway_pir"
kind = "pir"
zone = "entrance"
name = "Downstairs hallway motion"
# Also watch the downstairs hallway at night.
modes = ["away", "night"]

[[sensors]]
id = "kitchen_smoke"
kind = "smoke"
zone = "kitchen"
name = "Kitchen smoke detector"

[[sensors]]
id = "sink_leak"
kind = "leak"
zone = "kitchen"
name = "Kitchen sink leak sensor"

[[cameras]]
# The camera name in config/frigate/config.yml.
id = "front_cam"
zone = "entrance"
name = "Front door camera"

# --- Connections and device names ------------------------------------------

[mqtt]
# homeguard runs in the host network and reaches Mosquitto on loopback.
host = "127.0.0.1"
port = 1883
client_id = "homeguard"
# Names of the environment variables (from .env) holding the login.
username_env = "MQTT_HOMEGUARD_USER"
password_env = "MQTT_HOMEGUARD_PASSWORD"
keep_alive = "30s"

[zigbee]
base_topic = "zigbee2mqtt"

# Zigbee2MQTT friendly name → sensor id above. Only needed when they differ;
# the simplest is to rename each device in Zigbee2MQTT to its sensor id.
[zigbee.devices]
# "0x00158d0008a1b2c3" = "front_door"

[frigate]
topic_prefix = "frigate"
# Frigate's API on loopback, for snapshots.
url = "http://127.0.0.1:5000"

# wisense link id (the WiFi interface, e.g. wlp2s0, or an ESP32 link name)
# → sensor id above.
[wisense.links]
wlp2s0 = "living_room_wisense"

# Zigbee devices homeguard drives itself during an alarm (optional).
[actuators]
# siren = "hall_siren"
lights = []
